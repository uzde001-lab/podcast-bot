services:
  - type: web
    name: podcast-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 900
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: YT_PROXY
        sync: false
      - key: YT_COOKIES_B64
        sync: false
      - key: PUBLIC_URL
        sync: false
